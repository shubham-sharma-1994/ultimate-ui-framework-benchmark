[package]
name = "pulse-slint"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pulse-slint"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
slint-build = "1.8.0"

# Desktop + web: Slint defaults (GPU renderer where available)
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.8.0", features = ["serde"] }

# Android: Slint's android-activity backend (entry point is `android_main` in src/lib.rs).
# Software renderer only: the default OpenGL (femtovg) path showed a blank white window on a real device.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.8.0", default-features = false, features = ["std", "compat-1-2", "serde", "backend-android-activity-06", "renderer-software"] }

[package.metadata.android]
package = "dev.pulse.slint"
build_targets = ["aarch64-linux-android"]
apk_name = "pulse-slint"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Pulse Slint"

[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"
