name: Quasar CI

on:
  push:
    paths:
      - 'apps/quasar/**'
      - '.github/workflows/quasar.yml'
  pull_request:
    paths:
      - 'apps/quasar/**'
      - '.github/workflows/quasar.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/quasar/package.json'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        working-directory: apps/quasar
        run: pnpm install --ignore-scripts

      - name: Build Web
        working-directory: apps/quasar
        run: pnpm build

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quasar-web
          path: apps/quasar/dist
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    continue-on-error: true # Android setup is best effort
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/quasar/package.json'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        working-directory: apps/quasar
        run: pnpm install --ignore-scripts

      - name: Build Web for Capacitor
        working-directory: apps/quasar
        run: pnpm build

      - name: Sync Capacitor Android
        working-directory: apps/quasar
        run: npx cap sync android

      - name: Build Android APK
        working-directory: apps/quasar/android
        run: ./gradlew assembleRelease

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quasar-android
          path: apps/quasar/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/quasar/package.json'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        working-directory: apps/quasar
        run: pnpm install --ignore-scripts

      - name: Build Windows
        working-directory: apps/quasar
        run: |
          echo "Windows build with Electron is skipped natively by default as we used SPA template"
          echo "Skipped" > skipped.txt

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quasar-windows
          path: apps/quasar/skipped.txt
          retention-days: 30
