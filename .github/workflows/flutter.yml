name: Flutter CI

on:
  push:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - working-directory: apps/flutter
        run: flutter pub get
      - working-directory: apps/flutter
        run: flutter build web
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: apps/flutter/build/web
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - working-directory: apps/flutter
        run: flutter pub get
      - working-directory: apps/flutter
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-android
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - working-directory: apps/flutter
        run: flutter config --enable-windows-desktop
      - working-directory: apps/flutter
        run: flutter pub get
      - working-directory: apps/flutter
        run: flutter build windows
      - working-directory: apps/flutter/build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath ../../../../../../app-flutter-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-windows
          path: app-flutter-windows.zip
          retention-days: 30
