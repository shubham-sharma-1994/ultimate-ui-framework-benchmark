name: Dioxus CI

on:
  push:
    paths:
      - 'apps/dioxus/**'
      - '.github/workflows/dioxus.yml'
  pull_request:
    paths:
      - 'apps/dioxus/**'
      - '.github/workflows/dioxus.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/dioxus
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.6.3 || echo "Assuming already installed"
      - name: Build Web
        working-directory: apps/dioxus
        run: dx build --release || cargo build --target wasm32-unknown-unknown --release
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dioxus-web
          path: apps/dioxus/dist
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/dioxus
      - name: Build Windows
        working-directory: apps/dioxus
        run: cargo build --release
      - name: Package Windows Artifact
        working-directory: apps/dioxus
        run: Compress-Archive -Path target/release/dioxus_app.exe -DestinationPath app-dioxus-windows.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dioxus-windows
          path: apps/dioxus/app-dioxus-windows.zip
          retention-days: 30
