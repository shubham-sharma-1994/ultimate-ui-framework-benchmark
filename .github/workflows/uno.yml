name: Uno CI

on:
  push:
    paths:
      - 'apps/uno/**'
      - '.github/workflows/uno.yml'
  pull_request:
    paths:
      - 'apps/uno/**'
      - '.github/workflows/uno.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Workloads
        run: dotnet workload restore apps/uno/UnoPulse.sln || true
      - name: Install WASM Tools
        run: dotnet workload install wasm-tools || true
      - name: Install Uno
        run: dotnet tool install -g uno.check && uno-check -v --ci --non-interactive --fix || true
      - name: Build WebAssembly
        continue-on-error: true
        run: dotnet build apps/uno/UnoPulse/UnoPulse.csproj -c Release -f net10.0-browserwasm
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uno-web
          path: apps/uno/UnoPulse/bin/Release/net10.0-browserwasm/publish/wwwroot/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'
      - name: Install Workloads
        run: dotnet workload restore apps/uno/UnoPulse.sln || true
      - name: Install Uno
        run: dotnet tool install -g uno.check && uno-check -v --ci --non-interactive --fix || true
      - name: Build Android
        continue-on-error: true
        run: dotnet publish apps/uno/UnoPulse/UnoPulse.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk
      - name: Find Android APK
        id: find_apk
        continue-on-error: true
        run: |
          APK_PATH=$(find apps/uno -name '*-Signed.apk' -o -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "apk_path=MISSING" >> $GITHUB_ENV
          else
            echo "apk_path=$APK_PATH" >> $GITHUB_ENV
          fi
      - name: Rename Android Artifact
        continue-on-error: true
        run: |
          if [ "${{ env.apk_path }}" == "MISSING" ]; then
            echo "No APK found, skipping copy"
          else
            mkdir -p apk_output
            cp "${{ env.apk_path }}" apk_output/app-uno.apk
          fi
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uno-android
          path: apk_output/app-uno.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Workloads
        run: dotnet workload restore apps/uno/UnoPulse.sln || true
      - name: Build Windows
        continue-on-error: true
        run: dotnet publish apps/uno/UnoPulse/UnoPulse.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 -p:WindowsAppSDKSelfContained=true -o publish/windows
      - name: Zip Windows Output
        continue-on-error: true
        run: Compress-Archive -Path publish/windows/* -DestinationPath app-uno-windows.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uno-windows
          path: app-uno-windows.zip
