name: egui CI

on:
  push:
    paths:
      - 'apps/egui/**'
      - '.github/workflows/egui.yml'
  pull_request:
    paths:
      - 'apps/egui/**'
      - '.github/workflows/egui.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/egui/target
          key: egui-windows-${{ hashFiles('apps/egui/Cargo.lock') }}
      - name: Build Windows
        working-directory: apps/egui
        run: cargo build --release
      - name: Package Windows Artifact
        working-directory: apps/egui
        run: |
          mkdir release
          cp target/release/pulse-egui.exe release/app-pulse-egui.exe
          Compress-Archive -Path release\* -DestinationPath app-pulse-egui-windows.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egui-windows
          path: apps/egui/app-pulse-egui-windows.zip
          retention-days: 30

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/egui/target
          key: egui-web-${{ hashFiles('apps/egui/Cargo.lock') }}
      - name: Build Web
        working-directory: apps/egui
        run: trunk build --release
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egui-web
          path: apps/egui/dist
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-apk
            apps/egui/target
          key: egui-android-${{ hashFiles('apps/egui/Cargo.lock') }}
      - name: Install cargo-apk
        run: command -v cargo-apk || cargo install cargo-apk --locked
      - name: Create debug keystore
        run: |
          test -f apps/egui/debug.keystore || keytool -genkey -v -keystore apps/egui/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        working-directory: apps/egui
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --release --lib --target aarch64-linux-android
      - name: Collect APK
        run: |
          mkdir -p out
          find apps/egui/target -name '*.apk' -ls
          APK=apps/egui/target/release/apk/pulse-egui.apk
          test -f "$APK" || APK=$(find apps/egui/target -name '*.apk' | head -1)
          test -n "$APK" || { echo "no APK produced"; exit 1; }
          cp "$APK" out/unsigned-or-signed.apk
      - name: Sign APK
        run: |
          bash scripts/sign-apk.sh out/unsigned-or-signed.apk out/app-pulse-egui.apk
          rm out/unsigned-or-signed.apk
      - name: Inspect APK
        continue-on-error: true
        run: |
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)
          echo "== badging"; "$BT/aapt2" dump badging out/app-pulse-egui.apk | head -30
          echo "== manifest"; "$BT/aapt2" dump xmltree --file AndroidManifest.xml out/app-pulse-egui.apk
          echo "== signature"; "$BT/apksigner" verify --verbose --print-certs out/app-pulse-egui.apk | head -12
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: egui-android
          path: out/app-pulse-egui.apk
          retention-days: 30
