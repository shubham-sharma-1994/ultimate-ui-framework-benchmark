name: Electron Build

on:
  push:
    paths:
      - 'apps/electron/**'
      - '.github/workflows/electron.yml'
  pull_request:
    paths:
      - 'apps/electron/**'
      - '.github/workflows/electron.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/electron
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/electron/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web
        run: npm run build

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-web
          path: apps/electron/dist/renderer
          retention-days: 30

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/electron
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/electron/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Electron for Windows
        run: npm run build:electron

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: apps/electron/dist-electron/*.zip
          retention-days: 30
