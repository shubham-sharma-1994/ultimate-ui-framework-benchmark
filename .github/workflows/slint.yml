name: Slint CI

on:
  push:
    paths:
      - 'apps/slint/**'
      - '.github/workflows/slint.yml'
  pull_request:
    paths:
      - 'apps/slint/**'
      - '.github/workflows/slint.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Windows
        working-directory: apps/slint
        run: cargo build --release
      - name: Package Windows Artifact
        working-directory: apps/slint
        run: |
          mkdir release
          cp target/release/pulse-slint.exe release/app-pulse-slint.exe
          Compress-Archive -Path release\* -DestinationPath app-pulse-slint-windows.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-slint-windows
          path: apps/slint/app-pulse-slint-windows.zip
          retention-days: 30

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
      - name: Build Web
        working-directory: apps/slint
        run: |
          cat > index.html << 'HTML'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Pulse Slint</title>
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <link data-trunk rel="rust" href="Cargo.toml" data-bin="pulse-slint" />
            </head>
            <body>
            </body>
          </html>
          HTML
          trunk build --release
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-slint-web
          path: apps/slint/dist
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-apk
            apps/slint/target
          key: slint-android-${{ hashFiles('apps/slint/Cargo.lock') }}
      - name: Install cargo-apk
        run: command -v cargo-apk || cargo install cargo-apk --locked
      - name: Create debug keystore (used to sign the release APK)
        run: |
          test -f apps/slint/debug.keystore || keytool -genkey -v -keystore apps/slint/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        working-directory: apps/slint
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --release --lib --target aarch64-linux-android
      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find apps/slint/target -name '*.apk' | head -1)
          test -n "$APK" || { echo "no APK produced"; exit 1; }
          cp "$APK" out/app-slint.apk
      - name: Inspect APK (diagnostics)
        continue-on-error: true
        run: |
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)
          echo "== badging"; "$BT/aapt2" dump badging out/app-slint.apk | head -30
          echo "== manifest"; "$BT/aapt2" dump xmltree --file AndroidManifest.xml out/app-slint.apk
          echo "== zip"; unzip -v out/app-slint.apk
          echo "== signature"; "$BT/apksigner" verify --verbose --print-certs out/app-slint.apk | head -12
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-slint-android
          path: out/app-slint.apk
          retention-days: 30
