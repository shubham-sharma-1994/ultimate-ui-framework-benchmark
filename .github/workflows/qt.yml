name: Qt Pulse App

on:
  push:
    paths:
      - 'apps/qt/**'
      - '.github/workflows/qt.yml'
  pull_request:
    paths:
      - 'apps/qt/**'
      - '.github/workflows/qt.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.25
          actions-cache-folder: 'emsdk-cache'
      - name: Install Qt (Desktop)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          cache: true
          install-deps: 'false'
          dir: '${{ github.workspace }}/Qt'
      - name: Install Qt (Wasm)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'wasm_singlethread'
          cache: false
          install-deps: 'false'
          dir: '${{ github.workspace }}/Qt'
      - name: Install Ninja & Sys Deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libegl1 libfontconfig1-dev libxcb-cursor0
      - name: Build WebAssembly
        working-directory: apps/qt
        continue-on-error: true
        run: |
          mkdir build && cd build
          qt-cmake -DCMAKE_BUILD_TYPE=Release -GNinja ..
          cmake --build .
      - name: Upload Web Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qt-web
          path: apps/qt/build/PulseApp
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.25
          actions-cache-folder: 'emsdk-cache'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'android'
          arch: 'android_armv7'
          cache: true
          install-deps: 'false'
      - name: Install Ninja & Sys Deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libegl1 libfontconfig1-dev libxcb-cursor0
      - name: Build Android
        working-directory: apps/qt
        run: |
          mkdir build && cd build
          qt-cmake -DCMAKE_BUILD_TYPE=Release -GNinja -DQT_ANDROID_ABIS="armeabi-v7a;arm64-v8a" ..
          ninja
          cmake --build . --target apk
        continue-on-error: true
      - name: Sign APK (shared debug key, so it installs)
        run: bash scripts/sign-apk.sh "$(ls apps/qt/build/android-build/build/outputs/apk/release/*.apk | head -1)" signed/pulse-qt.apk
        continue-on-error: true
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qt-android
          path: signed/pulse-qt.apk
          retention-days: 30
        continue-on-error: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.25
          actions-cache-folder: 'emsdk-cache'
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true
          install-deps: 'false'
      - name: Build Windows
        working-directory: apps/qt
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:IQTA_TOOLS\Qt\6.5.3\msvc2019_64" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release
          cpack -G ZIP
        continue-on-error: true
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qt-windows
          path: apps/qt/build/*.zip
          retention-days: 30
        continue-on-error: true
