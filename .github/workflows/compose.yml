name: Compose Multiplatform Pulse

on:
  push:
    paths:
      - 'apps/compose/**'
      - '.github/workflows/compose.yml'
  pull_request:
    paths:
      - 'apps/compose/**'
      - '.github/workflows/compose.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/gradle-build-action@v2
      - name: Build Web
        run: cd apps/compose && ./gradlew wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: compose-web
          path: apps/compose/composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/gradle-build-action@v2
      - name: Build Android
        run: cd apps/compose && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: compose-android
          path: apps/compose/composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/gradle-build-action@v2
      - name: Build Windows
        run: cd apps/compose && ./gradlew packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: compose-windows
          path: apps/compose/composeApp/build/compose/binaries/main/app/
          retention-days: 30
