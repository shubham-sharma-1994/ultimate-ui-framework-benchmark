name: Ionic CI

on:
  push:
    paths:
      - 'apps/ionic/**'
      - '.github/workflows/ionic.yml'
  pull_request:
    paths:
      - 'apps/ionic/**'
      - '.github/workflows/ionic.yml'
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: apps/ionic/package-lock.json

      - name: Install dependencies
        working-directory: apps/ionic
        run: npm ci

      - name: Build Web
        working-directory: apps/ionic
        run: npm run build

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ionic-web
          path: apps/ionic/dist/
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: apps/ionic/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        working-directory: apps/ionic
        run: npm ci

      - name: Build Web
        working-directory: apps/ionic
        run: npm run build

      - name: Sync Capacitor
        working-directory: apps/ionic
        run: npx cap sync android

      - name: Build Android APK
        working-directory: apps/ionic/android
        run: ./gradlew assembleRelease

      - name: Sign APK (shared debug key, so it installs)
        run: bash scripts/sign-apk.sh "$(ls apps/ionic/android/app/build/outputs/apk/release/app-release-unsigned.apk | head -1)" signed/pulse-ionic.apk
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ionic-android
          path: signed/pulse-ionic.apk
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: apps/ionic/package-lock.json

      - name: Install root dependencies
        working-directory: apps/ionic
        run: npm ci

      - name: Install electron dependencies
        working-directory: apps/ionic/electron
        run: npm install

      - name: Build Web
        working-directory: apps/ionic
        run: npm run build

      - name: Sync Electron
        working-directory: apps/ionic
        run: npx cap sync electron

      - name: Build Windows App
        working-directory: apps/ionic/electron
        run: npm run electron:make

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ionic-windows
          path: apps/ionic/electron/dist/*.zip
          retention-days: 30
