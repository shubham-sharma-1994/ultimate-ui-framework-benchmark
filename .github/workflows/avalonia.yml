name: Avalonia Pulse App

on:
  push:
    paths:
      - 'apps/avalonia/**'
      - '.github/workflows/avalonia.yml'
  pull_request:
    paths:
      - 'apps/avalonia/**'
      - '.github/workflows/avalonia.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools
      - name: Publish Web
        working-directory: apps/avalonia
        run: dotnet publish Pulse.Browser/Pulse.Browser.csproj -c Release -o output-web
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-web
          path: apps/avalonia/output-web/wwwroot
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Publish Android
        working-directory: apps/avalonia
        run: dotnet publish Pulse.Android/Pulse.Android.csproj -c Release -f net8.0-android -p:AndroidPackageFormat=apk -o output-android || true
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-android
          path: apps/avalonia/output-android/*-Signed.apk
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows
        working-directory: apps/avalonia
        run: dotnet publish Pulse.Desktop/Pulse.Desktop.csproj -c Release -r win-x64 --self-contained -o output-windows
      - name: Zip Windows Artifact
        working-directory: apps/avalonia
        run: Compress-Archive -Path output-windows\* -DestinationPath app-avalonia-windows.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-windows
          path: apps/avalonia/app-avalonia-windows.zip
          retention-days: 30
